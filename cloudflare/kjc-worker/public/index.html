<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#242a27">
  <title>KJC Field Station</title>
  <style>
    :root {
      color-scheme: dark;
      --field-green: #8f9970;
      --field-green-dark: #687052;
      --field-dark: #242a27;
      --field-paper: #f6f3ee;
      --ink: #171717;
    }

    * { box-sizing: border-box; }

    html { background: var(--field-dark); }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--field-paper);
      background:
        radial-gradient(circle at 50% -10%, rgba(143, 153, 112, .18), transparent 38rem),
        linear-gradient(180deg, #343c37 0%, var(--field-dark) 52%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .station {
      width: min(calc(100% - 2rem), 36rem);
      margin: 0 auto;
      padding: max(2.5rem, env(safe-area-inset-top)) 0 max(4rem, env(safe-area-inset-bottom));
    }

    .station-label {
      margin: 0 0 .7rem;
      color: rgba(246, 243, 238, .68);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 9ch;
      margin: 0 0 .7rem;
      color: var(--field-paper);
      font-size: clamp(2.65rem, 12vw, 4.25rem);
      line-height: .92;
      letter-spacing: -.055em;
    }

    .station-intro {
      max-width: 30rem;
      margin: 0 0 2rem;
      color: rgba(246, 243, 238, .76);
      font-size: 1rem;
    }

    .upload-form {
      display: grid;
      gap: 1rem;
      padding: 1.25rem;
      color: var(--ink);
      background: var(--field-paper);
      border: .48rem solid var(--field-green);
      border-radius: 1rem;
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .24);
    }

    .field { display: grid; gap: .38rem; }

    label {
      font-size: .82rem;
      font-weight: 750;
      letter-spacing: .025em;
    }

    input,
    textarea {
      width: 100%;
      padding: .88rem .9rem;
      color: var(--ink);
      background: #fff;
      border: 1px solid rgba(23, 23, 23, .25);
      border-radius: .55rem;
      font: inherit;
    }

    input:focus,
    textarea:focus {
      border-color: var(--field-green-dark);
      outline: .18rem solid rgba(143, 153, 112, .28);
    }

    input[type="file"] { padding: .7rem; }
    textarea { min-height: 5.5rem; resize: vertical; }

    .metadata-grid {
      display: grid;
      grid-template-columns: .65fr 1.35fr;
      gap: .8rem;
    }

    .upload-button {
      width: 100%;
      min-height: 3.25rem;
      padding: .95rem 1rem;
      color: #fff;
      background: var(--field-dark);
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .upload-button:disabled { cursor: wait; opacity: .55; }
    progress { width: 100%; height: .8rem; accent-color: var(--field-green); }
    .status { min-height: 1.5rem; margin: 0; font-size: .9rem; }
    .status[data-kind="error"] { color: #a32222; }
    .status[data-kind="success"] { color: #32613a; font-weight: 750; }
    .technical-note { margin: .25rem 0 0; color: #5c5c5c; font-size: .78rem; }

    @media (max-width: 520px) {
      .station { padding-top: max(2.25rem, env(safe-area-inset-top)); }
      .metadata-grid { grid-template-columns: 1fr; }
      .upload-form { padding: 1rem; }
    }
  </style>
</head>
<body>
  <main class="station">
    <p class="station-label">Direct from inside</p>
    <h1>KJC Field Station</h1>
    <p class="station-intro">Choose the transmission, identify it, send it.</p>

    <form class="upload-form" id="upload-form">
      <div class="field">
        <label for="token">Publishing passphrase</label>
        <input id="token" name="token" type="password" autocomplete="current-password" required>
      </div>

      <div class="field">
        <label for="video">Video</label>
        <input id="video" name="video" type="file" accept="video/mp4,video/quicktime,.mp4,.mov" required>
        <p class="technical-note">V0 accepts MP4 or MOV files up to 600 MB.</p>
      </div>

      <div class="metadata-grid">
        <div class="field">
          <label for="number">Transmission</label>
          <input id="number" name="number" type="number" min="1" max="999" value="1" required>
        </div>
        <div class="field">
          <label for="location">Location</label>
          <input id="location" name="location" type="text" maxlength="100" placeholder="Amsterdam" required>
        </div>
      </div>

      <div class="field">
        <label for="date">Date</label>
        <input id="date" name="date" type="date" required>
      </div>

      <div class="field">
        <label for="note">One short line <span aria-hidden="true">(optional)</span></label>
        <textarea id="note" name="note" maxlength="280"></textarea>
      </div>

      <button class="upload-button" id="upload-button" type="submit">Publish transmission</button>
      <progress id="progress" max="100" value="0" hidden>0%</progress>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
